name: Release Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-windows-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package Windows Release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package -Force
          $exe = Get-ChildItem -Path build -Recurse -Filter "VortexArena3D.exe" | Select-Object -First 1
          if (-not $exe) {
              $exe = Get-ChildItem -Path build -Recurse -Filter "*.exe" | Where-Object { $_.Name -notlike "*test*" } | Select-Object -First 1
          }
          Write-Host "Found executable at: $($exe.FullName)"
          Copy-Item $exe.FullName -Destination package\VortexArena3D.exe
          if (Test-Path assets) { Copy-Item -Recurse assets -Destination package\assets }
          if (Test-Path game_data) { Copy-Item -Recurse game_data -Destination package\game_data }
          Copy-Item README.md -Destination package\
          Compress-Archive -Path package\* -DestinationPath VortexArena3D-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexArena3D-Windows-x64
          path: VortexArena3D-Windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-linux-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release
        run: cmake --build build --config Release --parallel

      - name: Package Linux Release
        run: |
          mkdir -p package
          EXE=$(find build -type f -name "VortexArena3D" -perm /111 | head -n 1)
          if [ -z "$EXE" ]; then
              EXE=$(find build -type f -perm /111 ! -name "*test*" | head -n 1)
          fi
          echo "Found binary at: $EXE"
          cp "$EXE" package/VortexArena3D
          [ -d assets ] && cp -r assets package/assets || true
          [ -d game_data ] && cp -r game_data package/game_data || true
          cp README.md package/
          tar -czvf VortexArena3D-Linux-x64.tar.gz -C package .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VortexArena3D-Linux-x64
          path: VortexArena3D-Linux-x64.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: VortexArena3D-Windows-x64
          path: release-artifacts

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: VortexArena3D-Linux-x64
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: VortexArena3D ${{ github.ref_name }} Playable Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/VortexArena3D-Windows-x64.zip
            release-artifacts/VortexArena3D-Linux-x64.tar.gz
