name: Release Build & Deploy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: VortexArena3D-Windows-x64.zip
            binary_path: build/Release/VortexArena3D.exe
            package_cmd: |
              mkdir package
              copy build\Release\VortexArena3D.exe package\
              xcopy /E /I assets package\assets
              xcopy /E /I game_data package\game_data
              copy README.md package\
              Compress-Archive -Path package\* -DestinationPath VortexArena3D-Windows-x64.zip
          - os: ubuntu-latest
            artifact_name: VortexArena3D-Linux-x64.tar.gz
            binary_path: build/VortexArena3D
            package_cmd: |
              mkdir package
              cp build/VortexArena3D package/
              cp -r assets package/assets
              cp -r game_data package/game_data
              cp README.md package/
              tar -czvf VortexArena3D-Linux-x64.tar.gz -C package .

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config \
            libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxi-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-release-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build Release Binary
        run: cmake --build build --config Release --parallel

      - name: Package Release
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: ${{ matrix.package_cmd }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: VortexArena3D ${{ github.ref_name || 'v1.0.0' }} Playable Release
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/VortexArena3D-Windows-x64.zip/VortexArena3D-Windows-x64.zip
            release-artifacts/VortexArena3D-Linux-x64.tar.gz/VortexArena3D-Linux-x64.tar.gz
